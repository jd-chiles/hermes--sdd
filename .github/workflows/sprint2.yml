name: Hermes SDD Sprint 2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repository:
    name: Repository checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and unit test
        run: |
          python -m compileall -q sdd_hermes scripts
          python -m unittest discover -s tests -v
      - name: Build release artifact
        run: python scripts/package_release.py --output artifact/hermes-sdd.tar.gz
      - name: Check artifact manifest
        shell: bash
        run: test -s artifact/hermes-sdd.tar.gz && test -s artifact/hermes-sdd.tar.gz.json

  hermes-linux:
    name: Hermes host contract (Linux)
    runs-on: ubuntu-latest
    needs: repository
    steps:
      - uses: actions/checkout@v4
      - name: Install Hermes
        shell: bash
        # Download-then-execute rather than piping a remote script straight
        # into a shell: the installer is fetched, written to disk, and run
        # only after the transfer succeeds, and the Hermes revision is pinned
        # for a reproducible contract run.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hermes-install.sh https://hermes-agent.nousresearch.com/install.sh
          bash /tmp/hermes-install.sh --commit 8f897d2d23a338f7a062ebc4fa7aedc287d087de --non-interactive
      - name: Plugin Doctor
        run: hermes plugins doctor . --ci
      - name: Plugin validation
        run: hermes plugins validate .

  hermes-macos:
    name: Hermes host contract (macOS)
    runs-on: macos-latest
    needs: repository
    steps:
      - uses: actions/checkout@v4
      - name: Install Hermes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hermes-install.sh https://hermes-agent.nousresearch.com/install.sh
          bash /tmp/hermes-install.sh --commit 8f897d2d23a338f7a062ebc4fa7aedc287d087de --non-interactive
      - name: Plugin Doctor
        run: hermes plugins doctor . --ci
      - name: Plugin validation
        run: hermes plugins validate .

  hermes-wsl2:
    name: Hermes host contract (Windows WSL2)
    runs-on: windows-latest
    needs: repository
    steps:
      - uses: actions/checkout@v4
      - name: Verify WSL2 availability
        shell: pwsh
        run: wsl.exe --status
      - name: Run Linux host checks through WSL2
        shell: pwsh
        # The installer is staged into the WSL filesystem first and executed
        # from disk there, so no remote script is piped straight into a shell.
        run: |
          wsl.exe --install -d Ubuntu
          $path = $PWD.Path.Replace('\', '/')
          $drive = $path.Substring(0, 1).ToLower()
          $path = "/mnt/$drive" + $path.Substring(2)
          wsl.exe bash -lc "curl -fsSL -o /tmp/hermes-install.sh https://hermes-agent.nousresearch.com/install.sh"
          wsl.exe bash -lc "bash /tmp/hermes-install.sh --commit 8f897d2d23a338f7a062ebc4fa7aedc287d087de --non-interactive"
          wsl.exe bash -lc "cd '$path' && hermes plugins doctor . --ci && hermes plugins validate ."
